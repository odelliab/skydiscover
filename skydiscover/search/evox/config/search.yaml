
# General settings
max_iterations: 100
# NOTE: evolve search checkpoint interval = 1, evolve program checkpoint interval = 10
checkpoint_interval: 1
log_level: "INFO"

# LLM intentionally unset: the meta-search inherits the parent discovery
# process's endpoint/models by default. To run the meta-search on a different
# provider, add an explicit `models`/`api_base` here (their presence disables
# provider inheritance), or set `search.share_llm: true` to force inheritance.
# To keep a CHEAPER GUIDE model on the inherited endpoint, declare only
# `guide_models` below — provider inheritance still applies, and the guide
# inherits the parent's api_base/api_key when it doesn't set its own.
llm:
  temperature: 0.7
  max_tokens: 32000
  timeout: 600
  # Example guide-only override (uncomment to keep a cheaper meta-search guide):
  # guide_models:
  #   - name: "claude-haiku-4-5"
  #     max_tokens: 8000
  #     timeout: 300

search:
  type: "evox_meta"
  num_context_programs: 2

# Prompt configuration
prompt:
  template: "evox"
  system_message: evox_search_sys_prompt.txt

# Evaluator configuration
evaluator:
  timeout: 3600
  max_retries: 3
  cascade_evaluation: false

# Generation settings
diff_based_generation: false
max_solution_length: 60000
